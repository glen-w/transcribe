# Read the Docs scaffold (I4). Project slug / custom domain are owner judgements
# (see docs/dev/rtd_go_live_checklist.md). Do not publish a live public hostname
# in-repo until the project exists — scripts/release/stale_refs.sh denylists
# the public RTD hostname pattern until then.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
