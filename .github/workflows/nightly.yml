name: Nightly

on:
  schedule:
    # 05:15 UTC — after typical US evening; adjust if needed
    - cron: "15 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Isolate temp roots
        run: |
          mkdir -p "$RUNNER_TEMP/tr-data" "$RUNNER_TEMP/tr-projects" "$RUNNER_TEMP/tr-inbox" "$RUNNER_TEMP/tr-export"
          echo "TRANSCRIBE_DATA_DIR=$RUNNER_TEMP/tr-data" >> "$GITHUB_ENV"
          echo "TRANSCRIBE_PROJECTS_DIR=$RUNNER_TEMP/tr-projects" >> "$GITHUB_ENV"
          echo "TRANSCRIBE_INBOX_DIR=$RUNNER_TEMP/tr-inbox" >> "$GITHUB_ENV"
          echo "TRANSCRIBE_EXPORT_DIR=$RUNNER_TEMP/tr-export" >> "$GITHUB_ENV"
      - name: Acceptance (offline)
        run: make test-acceptance
      - name: Contracts
        run: make test-contracts
