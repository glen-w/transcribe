[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe"
version = "0.6.2"
description = "Local-first handwritten notebook OCR using Ollama vision models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Glen" }]
dependencies = [
  "Pillow>=10.0.0",
  "pymupdf>=1.24.0",
  "wordcloud>=1.9.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32.0", "pydantic>=2.0.0", "ebooklib>=0.18"]
export = ["ebooklib>=0.18"]
dev = ["pytest>=8.0.0", "streamlit>=1.32.0", "pydantic>=2.0.0", "ebooklib>=0.18"]

[project.scripts]
transcribe = "transcribe.__main__:main"
transcribe-ui = "transcribe.ui.app:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"transcribe.analysis" = ["data/*.json"]
"transcribe.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "smoke: fast critical-path smoke tests (pre-release subset)",
  "unit: isolated unit tests (optional tagging; not required)",
  "integration: live local Ollama (or other live dependency) — never for offline doubles",
  "slow: intentionally slow tests",
  "requires_ollama: live Ollama HTTP required",
  "requires_docker: Docker daemon required",
  "requires_network: outbound network required",
  "quarantined: temporarily excluded from the default suite (pytest marker, not corpus quarantine)",
]
# Default suite is offline: exclude live/heavy markers. Offline detector/service
# doubles live under tests/services/ and must NOT use the integration marker.
addopts = "-m 'not quarantined and not requires_ollama and not requires_docker and not requires_network and not slow and not integration'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
