[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe"
version = "0.1.1"
description = "Local-first handwritten notebook OCR using Ollama vision models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Glen" }]
dependencies = [
  "Pillow>=10.0.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32.0"]
dev = ["pytest>=8.0.0", "streamlit>=1.32.0"]

[project.scripts]
transcribe = "transcribe.__main__:main"
transcribe-ui = "transcribe.ui.app:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"transcribe.analysis" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "smoke: fast critical-path smoke tests",
  "unit: isolated unit tests",
  "integration: tests that require a live local Ollama server",
  "slow: intentionally slow tests",
  "requires_ollama: live Ollama HTTP required",
  "requires_docker: Docker daemon required",
  "requires_network: outbound network required",
  "quarantined: temporarily excluded from the default suite",
]
addopts = "-m 'not quarantined and not requires_ollama and not requires_docker and not requires_network and not slow and not integration'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
